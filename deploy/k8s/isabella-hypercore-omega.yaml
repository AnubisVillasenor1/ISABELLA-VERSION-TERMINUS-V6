metadata:
  name: isabella-skill-evidence
  namespace: isabella-hypercore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: isabella-skill-evidence
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: isabella-skill-evidence
  namespace: isabella-hypercore
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: isabella-skill-evidence
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: skill-evidence-policy
  namespace: isabella-hypercore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: isabella-skill-evidence
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: isabella-hypercore-router
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: isabella-bookpi
      ports:
        - protocol: TCP
          port: 8443

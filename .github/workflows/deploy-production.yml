# deploy-production.yml — cierre de aceptación ISA-325 / ISA-378.
#
# GATE estricto de despliegue a producción:
#   1. `validate-source`   — valida workflow de origen, run_id y SHA.
#   2. `secret-scan`       — gitleaks@v3 sobre el árbol completo (mismo SHA).
#   3. `verify-artifact`   — descarga `production-evidence-<sha>`,
#      `security-suite-<sha>` y `sbom-<sha>` del run de CI que produjo ese SHA,
#      y FALLA si `typecheck.ok !== true`, `tests.failed > 0`, `gate.ok !== true`
#      o si el SBOM no existe.
#   4. `deploy`            — `environment: production` (aprobación humana se
#      configura en el entorno de GitHub, no se puede forzar desde YAML).
#      Dentro del job, antes de publicar nada: `vercel pull --environment=production`
#      trae la configuración real del proyecto y `scripts/deploy-readiness.ts` la
#      evalúa con `VERCEL=1` (contrato serverless). Un `DEPLOY_READINESS_BLOCKED`
#      detiene la imagen `:production` y el despliegue.
#
# Despliegue automático: se dispara al COMPLETAR el workflow "CI/CD Pipeline - ISABELLA GENESIS ZERO-OPEX v3"
# (`workflow_run`). Un `push` a main no puede consumir artefactos de otro
# run (los artefactos son por-run), por eso este gate se engancha al `run`
# completo de CI en vez de a un segundo workflow paralelo; es la forma honesta
# de "consumir el artefacto del run anterior con nombre por SHA".
# Manual: `workflow_dispatch` con el `run_id` y `sha` del CI que generó la evidencia.
#
# Sin secretos en logs: nunca se imprime el contenido de la evidencia, sólo
# veredictos booleanos y el SHA.
name: Deploy Production Ω

on:
  workflow_run:
    workflows: ["CI/CD Pipeline - ISABELLA GENESIS ZERO-OPEX v3"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run ID de 'CI/CD Pipeline - ISABELLA GENESIS ZERO-OPEX v3' que produjo la evidencia"
        required: true
        type: string
      sha:
        description: "Commit SHA asociado al run de CI"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  deployments: write
  id-token: write

concurrency:
  group: deploy-production-${{ github.event.workflow_run.head_sha || github.event.inputs.sha }}
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate workflow source, run ID and SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      the_sha: ${{ steps.validate.outputs.the_sha }}
      ci_run_id: ${{ steps.validate.outputs.ci_run_id }}
    steps:
      - name: Validate the exact successful CI run (fail closed)
        id: validate
        shell: bash
        env:
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Invalid CI run ID."; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid full commit SHA."; exit 1; }

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const run = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/source-run.json", "utf8"));
          const expectedSha = process.env.EXPECTED_SHA;
          const expectedName = "CI/CD Pipeline - ISABELLA GENESIS ZERO-OPEX v3";
          const checks = {
            correctWorkflow: run.name === expectedName,
            successful: run.conclusion === "success",
            mainBranch: run.head_branch === "main",
            pushEvent: run.event === "push",
            exactSha: run.head_sha === expectedSha,
          };
          for (const [name, ok] of Object.entries(checks)) console.log(name + "=" + String(ok));
          if (Object.values(checks).some((ok) => !ok)) {
            console.error("Deployment gate rejected the CI run. Only a successful push run for the exact SHA on main is eligible.");
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "the_sha=" + run.head_sha + "\nci_run_id=" + run.id + "\n");
          NODE
          echo "Validated exact successful CI run for SHA $EXPECTED_SHA."

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate-source
    steps:
      - name: Checkout with full history (same SHA reachable)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v-pinned from tag v4
        with:
          ref: ${{ needs.validate-source.outputs.the_sha }}
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v-pinned from tag v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-artifact:
    name: Verify artifacts (evidence + security + SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - validate-source
      - secret-scan
    env:
      CI_RUN_ID: ${{ needs.validate-source.outputs.ci_run_id }}
      THE_SHA: ${{ needs.validate-source.outputs.the_sha }}
    steps:
      - name: Checkout the verified SHA (el gate se evalúa con el código de ese commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (medido: refs/tags/v4.4.0)
        with:
          ref: ${{ needs.validate-source.outputs.the_sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (medido: refs/tags/v4.4.0)
        with:
          node-version: '24'

      - name: Download production evidence (same SHA)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v-pinned from tag v4
        with:
          name: production-evidence-${{ env.THE_SHA }}
          path: evidence/
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download security suite (same SHA)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v-pinned from tag v4
        with:
          name: security-suite-${{ env.THE_SHA }}
          path: evidence/
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download SBOM (same SHA)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v-pinned from tag v4
        with:
          name: sbom-${{ env.THE_SHA }}
          path: evidence/
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Strict gate — production evidence, security suite and SBOM
        shell: bash
        run: node scripts/verify-deploy-gate.mjs --dir evidence --sha "$THE_SHA"
        env:
          THE_SHA: ${{ env.THE_SHA }}

      - name: Upload deploy evidence (same SHA)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v-pinned from tag v4
        with:
          name: deploy-evidence-${{ env.THE_SHA }}
          path: evidence/
          if-no-files-found: error

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - validate-source
      - secret-scan
      - verify-artifact
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      deployments: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v-pinned from tag v4
        with:
          ref: ${{ needs.validate-source.outputs.the_sha }}

      - name: Compute image coordinates
        id: img
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/isabella-terminus-v6" >> "$GITHUB_OUTPUT"

      # Configuración primero, imagen después: `vercel pull` trae el entorno de producción
      # del proyecto y `deploy:readiness` lo evalúa ANTES de publicar la etiqueta
      # `:production`. Así un gate bloqueado no deja en GHCR una imagen que un
      # operador de k8s pueda desplegar creyendo que pasó la revisión.
      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v-pinned from tag v3
        with:
          version: "10.28.0"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (medido: refs/tags/v4.4.0)
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vercel is the serverless target (vercel.json + api/index.js). It runs only when the three
      # credentials exist; otherwise the job reports the gap instead of pretending it deployed.
      - name: Pull production environment from Vercel
        id: pull
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token "${VERCEL_TOKEN}"
          # `vercel pull` no escribe el archivo si el proyecto no tiene ninguna variable de
          # producción: eso es un gate sin material, no un despliegue limpio.
          [[ -f .env.production ]] || { echo "::error::El proyecto de producción no tiene variables de entorno configuradas; deploy:readiness no puede evaluarse."; exit 1; }

      # El archivo queda en el workspace (`.gitignore` lo cubre con `.env.*`) y nunca se
      # imprime: el script lee KEY=VALUE y sólo emite identificadores y veredictos.
      # VERCEL=1 fuerza el contrato serverless del gate; sin esa bandera un almacén de
      # claves o de federación en fichero pasaría la revisión y perdería su estado en el
      # primer arranque en frío.
      - name: Deploy readiness gate (producción real, valores nunca impresos)
        id: readiness
        if: ${{ steps.pull.outcome == 'success' }}
        shell: bash
        env:
          VERCEL: "1"
        run: pnpm exec tsx scripts/deploy-readiness.ts .env.production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v-pinned from tag v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v-pinned from tag v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deployable artifact: the exact image the compose/k8s manifests run, tagged by the verified SHA.
      - name: Build and push production image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v-pinned from tag v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.validate-source.outputs.the_sha }}
            ${{ steps.img.outputs.name }}:production
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Deploy to Vercel (prebuilt)
        id: vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest build --prod --token "${VERCEL_TOKEN}"
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token "${VERCEL_TOKEN}")"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke (fail closed)
        id: smoke
        if: ${{ steps.vercel.outputs.url != '' }}
        env:
          SMOKE_BASE_URL: ${{ steps.vercel.outputs.url }}
          # Nivel por defecto: CERTIFICADO. La compuerta de configuración corre antes de
          # publicar, así que exigir GET /api/v1/readyz = 200 con readiness.ready=true es
          # coherente con lo que el pipeline ya afirmó. Bajarlo a borrador tiene que ser
          # una declaración explícita (variable de repo `SMOKE_TIER=draft`), y el descenso
          # aparece nombrado en la summary: un borrador no es una certificación.
          SMOKE_REQUIRE_READINESS: ${{ vars.SMOKE_TIER == 'draft' && 'false' || 'true' }}
        run: pnpm run smoke:production

      - name: Deployment summary
        if: always()
        shell: bash
        env:
          THE_SHA: ${{ needs.validate-source.outputs.the_sha }}
          VERCEL_URL_OUT: ${{ steps.vercel.outputs.url }}
          IMAGE: ${{ steps.img.outputs.name }}
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SMOKE_TIER_LABEL: ${{ vars.SMOKE_TIER == 'draft' && 'draft-contract' || 'certified-production' }}
        run: |
          {
            echo "## Deploy Production Ω"
            echo "- SHA verificado: \`${THE_SHA}\`"
            # Un gate `skipped` no es un gate aprobado: se nombra como lo que es. Y un
            # gate fallado no se atribuye a «credenciales faltantes» a ciegas: el paso
            # ya nombró los identificadores (nunca los valores).
            case "${READINESS_OUTCOME:-}" in
              success) echo "- Deploy readiness (configuración real de producción): **superada**";;
              failure) echo "- Deploy readiness (configuración real de producción): **BLOQUEADA** — la configuración del proyecto no cumple el contrato; ver los IDs `DR-*`/`PF-*` del paso. Este SHA no se publicó";;
              *) echo "- Deploy readiness (configuración real de producción): **no evaluada** (faltan VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID en el entorno \`production\`)";;
            esac
            if [ "${IMAGE_OUTCOME:-}" = "success" ]; then
              echo "- Imagen publicada: \`${IMAGE}:${THE_SHA}\` (y \`:production\`)"
            else
              echo "- Imagen: **no publicada**"
            fi
            if [ -n "${VERCEL_URL_OUT:-}" ]; then
              echo "- Vercel: desplegado en ${VERCEL_URL_OUT}"
              case "${SMOKE_OUTCOME:-}" in
                success) echo "- Smoke post-despliegue: **${SMOKE_TIER_LABEL}** — superado";;
                failure) echo "- Smoke post-despliegue: **${SMOKE_TIER_LABEL}** — FALLÓ; el despliegue queda **no certificado**";;
                *) echo "- Smoke post-despliegue: **no ejecutado**";;
              esac
            elif [ "${READINESS_OUTCOME:-}" = "failure" ]; then
              echo "- Vercel: **no desplegado** (la compuerta de readiness bloqueó el paso)"
            else
              echo "- Vercel: **no desplegado** (faltan VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID en el entorno \`production\`)"
            fi
            echo "- Aprobación humana: configurada en el entorno de GitHub \`production\`."
          } >> "$GITHUB_STEP_SUMMARY"

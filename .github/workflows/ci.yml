name: Isabella Genesis CI

on:
  push:
    branches: ["main", "genesis-v6-sovereign-evolution", "feature/canonical-libraries-governance", "evolution/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run security suite
        run: pnpm run security:suite
      - name: Upload security suite (same SHA, consumed by deploy-production.yml)
        uses: actions/upload-artifact@v4
        with:
          name: security-suite-${{ github.sha }}
          path: evidence/security-suite.json
          if-no-files-found: error

  production-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify, security]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate production evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/production-evidence.mjs
      - name: Upload production evidence (same SHA)
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  rust-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ige_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ige_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      IGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ige_test
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Require committed Rust lockfile
        working-directory: ige-omega
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::error::ige-omega/Cargo.lock is missing. Generate it with the approved Rust toolchain and commit it; CI will not silently resolve a new dependency graph."
            exit 1
          fi
      - name: Check formatting
        working-directory: ige-omega
        run: cargo fmt --all -- --check
      - name: Run Clippy with warnings denied
        working-directory: ige-omega
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run workspace tests
        working-directory: ige-omega
        run: cargo test --workspace --locked
      - name: Build gateway release
        working-directory: ige-omega
        run: cargo build --release -p gateway --locked
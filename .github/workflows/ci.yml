name: CI/CD Pipeline - ISABELLA GENESIS ZERO-OPEX v3

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.28.0'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/isabella-genesis

jobs:
  # ============================================================================
  # CODE QUALITY & SECURITY
  # ============================================================================
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.4.2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Prettier check
        run: pnpm run format:check

      - name: Run TypeCheck
        run: pnpm run typecheck

      - name: Guard .env.example (duplicates, real-looking secrets, undocumented variables)
        run: pnpm run check:env

      - name: Guard SOPS placeholders
        run: pnpm run check:sops

      - name: Guard docs/STATUS.md freshness
        run: node scripts/generate-status.mjs --check

      # Advisory until the layers are green in CI: these modules are excluded from the main typecheck
      # (see tsconfig.json). Remove `continue-on-error` and the exclusions together once clean.
      - name: TypeCheck excluded layers (advisory)
        run: pnpm run typecheck:layers
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.4.2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security suite
        run: pnpm run security:suite

      # El gate estricto de despliegue (deploy-production.yml) descarga esta evidencia por SHA.
      # `path: evidence/` en lugar de un único archivo: la suite escribe varios y publicar
      # solo el primero perdía el resto sin que nadie se enterara.
      - name: Publish security-suite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-suite-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=moderate

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master @ 2026-10-30
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.26.3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # TESTS
  # ============================================================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.4.2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test
        env:
          BOOKPI_INTEGRITY_SECRET: test-only-integrity-secret-never-production-2026
          NODE_ENV: test

      - name: Upload test coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v-pinned from tag v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # ============================================================================
  # PRODUCTION EVIDENCE — evidencia que exige el gate estricto de deploy-production.yml
  # ============================================================================
  production-evidence:
    name: Production Evidence and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.4.2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # El script ejecuta typecheck y la suite real, escribe evidence/production-evidence.json
      # con lo observado y sale != 0 si algo está en rojo: la evidencia nunca se inventa.
      - name: Collect production evidence
        run: pnpm run production:evidence
        env:
          BOOKPI_INTEGRITY_SECRET: test-only-integrity-secret-never-production-2026
          NODE_ENV: test

      # if-no-files-found: error — si falta la evidencia, el despliegue no puede quedar en verde.
      - name: Publish production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  # El SBOM se genera del propio pnpm-lock.yaml con scripts/generate-sbom.mjs: sin
  # `pnpm install` y sin dependencia de una action externa, y cubre los transitivos
  # que un inventario superficial perdería. deploy-production.yml descarga este
  # artefacto por nombre, así que el job no es opcional.
  sbom:
    name: SBOM SPDX 2.3 desde pnpm-lock.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.2
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Sin `pnpm install`: el generador sólo lee pnpm-lock.yaml y package.json.
      - name: Generate SBOM
        run: node scripts/generate-sbom.mjs --sha ${{ github.sha }} --out evidence/isabella-${{ github.sha }}.spdx.json

      - name: Upload SBOM (same SHA)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  # ============================================================================
  # IGE-Ω RUST WORKSPACE CI
  # ============================================================================
  ige-omega-ci:
    name: IGE-Ω Rust Workspace CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.0.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ige-omega/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ige-omega/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: rust-verify
        run: |
          cd ige-omega
          cargo fmt --all -- --check

      - name: Rust Verify - Clippy
        run: |
          cd ige-omega
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust Verify - Tests
        run: |
          cd ige-omega
          cargo test --workspace --locked

      - name: Rust Verify - Release Build
        run: |
          cd ige-omega
          cargo build --release -p gateway --locked

  # ============================================================================
  # DOCKER BUILD
  # ============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    needs: [lint-and-typecheck, security-scan, test, production-evidence, sbom, ige-omega-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v-pinned from tag v3

      - name: Validate Caddy configuration
        shell: bash
        run: |
          ADMIN_BCRYPT_HASH="$(docker run --rm caddy:2.8-alpine caddy hash-password --plaintext 'ci-validation-only')"
          docker run --rm \
            --mount type=bind,source="$GITHUB_WORKSPACE/config/Caddyfile",target=/etc/caddy/Caddyfile,readonly \
            --env "ADMIN_BCRYPT_HASH=$ADMIN_BCRYPT_HASH" \
            caddy:2.8-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Login to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v-pinned from tag v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v-pinned from tag v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v-pinned from tag v5
        with:
          context: .
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ============================================================================
  # STAGING DEPLOYMENT
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, ige-omega-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v-pinned from tag v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /opt/isabella
            IMAGE_TAG="$IMAGE_TAG" docker compose pull app
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d --no-build --remove-orphans
            curl --retry 30 --retry-connrefused --retry-delay 2 --max-time 5 -fsS http://localhost:8080/health >/dev/null
            curl --max-time 10 -fsS http://localhost:8080/api/v1/readyz

  # ============================================================================
  # MANUAL PRODUCTION DEPLOYMENT (workflow_dispatch)
  # ============================================================================
  # Mismo gate que deploy-production.yml: sin production-evidence, security suite
  # y SBOM del SHA en curso, el job falla antes de tocar el host de producción.
  deploy-production-manual:
    name: Manual Production Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, ige-omega-ci, production-evidence, security-scan, sbom]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.2
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download production evidence (this run)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-evidence-${{ github.sha }}
          path: evidence/

      - name: Download security suite (this run)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: security-suite-${{ github.sha }}
          path: evidence/

      - name: Download SBOM (this run)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-${{ github.sha }}
          path: evidence/

      - name: Verify deploy gate (fail closed)
        run: node scripts/verify-deploy-gate.mjs --dir evidence

      - name: Manual Production Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v-pinned from tag v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /opt/isabella
            echo "Creating pre-deployment backup..."
            ./scripts/backup.sh full
            echo "Pulling image ${IMAGE_TAG}..."
            IMAGE_TAG="$IMAGE_TAG" docker compose pull app
            echo "Deploying version ${IMAGE_TAG}..."
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d --no-build --remove-orphans
            echo "Waiting for the runtime health check..."
            curl --retry 30 --retry-connrefused --retry-delay 2 --max-time 5 -fsS http://localhost:8080/health >/dev/null
            echo "Checking dependency readiness; migrations run in the app entrypoint..."
            curl --max-time 10 -fsS http://localhost:8080/api/v1/readyz
            echo "Manual deployment passed health and readiness checks."

  # ============================================================================
  # SECURITY RELEASE
  # ============================================================================
  security-release:
    name: Security Release
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.4.2
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.2
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security suite
        run: pnpm run security:suite

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Create security issue if vulnerabilities found
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v-pinned from tag v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security vulnerabilities detected in dependencies',
              body: 'Automated security scan found vulnerabilities. Please review and update dependencies.',
              labels: ['security', 'dependencies', 'automated']
            })

  # ============================================================================
  # RELEASE
  # ============================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [lint-and-typecheck, security-scan, test, production-evidence, sbom, build]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v-pinned from tag v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true

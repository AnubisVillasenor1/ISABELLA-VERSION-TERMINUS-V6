name: Isabella Genesis Ω Sovereign CI

on:
  push:
    branches:
      - main
      - genesis-v6-sovereign-evolution
      - feature/canonical-libraries-governance
      - evolution/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  security-events: write
  id-token: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.0"
  JAVA_VERSION: "17"
  RUST_BACKTRACE: full
  CI_MODE: sovereign

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Metadata & build id
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.meta.outputs.build_id }}
    steps:
      - name: Get Secrets (Bitwarden)
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            0.c5c1c1e6-b163-4fc2-a436-b4e60063331c.APINNfwKGi2FTrrFk5kf7mZLIaQtnn:FBneN3CZOl+BzzI/rUaSRw== > PERPLEXITY_API_KEY
            e3b15408-ee8e-428a-afc8-b4e600647398 > BRAINTRUST_API_KEY
            368b12e3-3ae5-4f31-b3cb-b4e60064ba8b > BRAINTRUST_PROJECT_ID
            368b12e3-3ae5-4f31-b3cb-b4e60064ba8b > OPENROUTER_API_KEY
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "build_id=$(date +%s)-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  ############################################################
  # SUPPLY CHAIN SECURITY
  ############################################################
  sbom:
    name: SBOM generation
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: "*.spdx.json"
          if-no-files-found: error

  ############################################################
  # NODEJS VERIFICATION
  ############################################################
  verify-node:
    name: Node verification (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - typecheck
          - test
          - build
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run suite
        run: pnpm ${{ matrix.suite }}

  ############################################################
  # RUST FEDERATION
  ############################################################
  rust-verify:
    name: Rust federation verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ige_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ige_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      IGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ige_test

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Require committed Rust lockfile
        working-directory: ige-omega
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f Cargo.lock ]; then
            echo "::error::ige-omega/Cargo.lock is missing."
            echo "::error::Generate it with the approved Rust toolchain and commit it."
            echo "::error::CI will not silently resolve a new dependency graph."
            exit 1
          fi

      - name: Install Cargo Audit (locked dependency resolution)
        run: cargo install cargo-audit --locked

      - name: Security Audit (blocking)
        working-directory: ige-omega
        run: cargo audit

      - name: Format
        working-directory: ige-omega
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: ige-omega
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        working-directory: ige-omega
        run: cargo test --workspace --locked

      - name: Release Build
        working-directory: ige-omega
        run: cargo build --release -p gateway --locked

  ############################################################
  # JENKINS FEDERATION
  ############################################################
  jenkins-plugin-verify:
    name: Jenkins plugin verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: gameover-jenkins-plugin/pom.xml

      - name: Test Plugin
        working-directory: gameover-jenkins-plugin
        run: mvn -B verify

  ############################################################
  # SECURITY COMMAND CENTER
  ############################################################
  security:
    name: Security command center
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Filesystem Scan (block high/critical vulnerabilities)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: CodeQL Init
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v3

  ############################################################
  # QUALITY GATE Ω
  ############################################################
  quality-gate:
    name: Quality Gate Ω
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - verify-node
      - rust-verify
      - security
      - jenkins-plugin-verify
    steps:
      - name: Validate Pipeline State
        shell: bash
        run: |
          set -euo pipefail
          echo "All required jobs passed."
          echo "Quality Gate Ω: PASSED"

  ############################################################
  # RELEASE READINESS Ω
  ############################################################
  readiness:
    name: Release readiness Ω
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - quality-gate
      - sbom
    steps:
      - name: Generate CI gate evidence (not a production-readiness score)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const evidence = {
            schemaVersion: "1.0.0",
            generatedBy: "github-actions-ci-gates",
            sha: process.env.GITHUB_SHA,
            branch: process.env.GITHUB_REF_NAME,
            ciGatesPassed: true,
            productionCertified: false,
            score: null,
            status: "CI_GATES_PASSED_NOT_PRODUCTION_CERTIFIED",
            timestamp: new Date().toISOString(),
          };
          fs.writeFileSync("evidence/readiness.json", JSON.stringify(evidence, null, 2) + "\n");
          NODE

      - name: Upload readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: readiness-${{ github.sha }}
          path: evidence/readiness.json
          if-no-files-found: error

  ############################################################
  # PRODUCTION EVIDENCE Ω
  ############################################################
  production-evidence:
    name: Production evidence and security artifacts Ω
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - readiness
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate measured production evidence
        run: pnpm run production:evidence

      - name: Generate security suite evidence
        run: pnpm run security:suite

      - name: Upload production evidence for exact SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-${{ github.sha }}
          path: evidence/production-evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload security suite evidence for exact SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-suite-${{ github.sha }}
          path: evidence/security-suite.json
          if-no-files-found: warn
          retention-days: 30

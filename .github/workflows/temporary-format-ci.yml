name: One-time baseline formatting repair

on:
  push:
    branches:
      - hardening/idr-total-improvements-2026-11-21
    paths:
      - ".github/workflows/temporary-format-ci.yml"

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hardening/idr-total-improvements-2026-11-21
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 10.28.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format only the known failing files
        run: >-
          pnpm exec prettier --write
          src/health/preflight.ts
          src/infinity/accessibility.ts
          src/infinity/design-tokens.ts
          src/infinity/i18n.ts
          src/routes/infinity.ts
          src/server.ts
      - name: Commit formatted files and remove temporary workflow
        run: |
          git rm .github/workflows/temporary-format-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/health/preflight.ts src/infinity/accessibility.ts src/infinity/design-tokens.ts src/infinity/i18n.ts src/routes/infinity.ts src/server.ts
          git commit -m "style: format files blocking repository CI"
          git push origin "HEAD:hardening/idr-total-improvements-2026-11-21"

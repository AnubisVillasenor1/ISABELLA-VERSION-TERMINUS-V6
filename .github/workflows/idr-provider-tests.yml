name: IDR provider contract tests

on:
  pull_request:
    paths:
      - "src/domain-runtime/**"
      - "src/routes/domain-runtime.ts"
      - "test/domain-runtime-*.test.ts"
      - ".github/workflows/idr-provider-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
  push:
    branches:
      - main
      - "feat/idr-semantic-router-v1"
    paths:
      - "src/domain-runtime/**"
      - "src/routes/domain-runtime.ts"
      - "test/domain-runtime-*.test.ts"
      - ".github/workflows/idr-provider-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"

permissions:
  contents: read

concurrency:
  group: idr-provider-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  idr-contract:
    name: IDR router and provider contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Enable pinned package manager
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Run IDR contract tests
        run: corepack pnpm exec vitest run test/domain-runtime-semantic-router.test.ts test/domain-runtime-embedding-providers.test.ts
      - name: Type-check repository
        run: corepack pnpm typecheck

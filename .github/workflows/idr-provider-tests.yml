name: IDR provider contract tests

on:
  pull_request:
    paths:
      - "src/domain-runtime/**"
      - "src/routes/domain-runtime.ts"
      - "test/domain-runtime-*.test.ts"
      - ".github/workflows/idr-provider-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
  push:
    branches:
      - main
      - "feat/idr-semantic-router-v1"
      - "hardening/idr-total-improvements-2026-11-21"
    paths:
      - "src/domain-runtime/**"
      - "src/routes/domain-runtime.ts"
      - "test/domain-runtime-*.test.ts"
      - ".github/workflows/idr-provider-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"

permissions:
  contents: write

concurrency:
  group: idr-provider-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  idr-contract:
    name: IDR router and provider contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v-pinned from tag v4
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10.28.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned by SHA
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Temporary one-time format repair for legacy CI blockers
        if: github.event_name == 'pull_request' && github.head_ref == 'hardening/idr-total-improvements-2026-11-21'
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
        run: |
          pnpm exec prettier --write src/health/preflight.ts src/infinity/accessibility.ts src/infinity/design-tokens.ts src/infinity/i18n.ts src/routes/infinity.ts src/server.ts
          if ! git diff --quiet -- src/health/preflight.ts src/infinity/accessibility.ts src/infinity/design-tokens.ts src/infinity/i18n.ts src/routes/infinity.ts src/server.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/health/preflight.ts src/infinity/accessibility.ts src/infinity/design-tokens.ts src/infinity/i18n.ts src/routes/infinity.ts src/server.ts
            git commit -m "style: format six files blocking repository CI"
            git push origin "HEAD:${GH_HEAD_REF}"
          fi
      - name: Run IDR contract tests
        run: pnpm exec vitest run test/domain-runtime-semantic-router.test.ts test/domain-runtime-embedding-providers.test.ts test/domain-runtime-routes.test.ts
      - name: Lint IDR implementation and tests
        run: pnpm exec eslint src/domain-runtime/semantic-router.ts src/domain-runtime/embedding-providers.ts src/routes/domain-runtime.ts test/domain-runtime-semantic-router.test.ts test/domain-runtime-embedding-providers.test.ts test/domain-runtime-routes.test.ts --max-warnings=0
      - name: Type-check repository
        run: pnpm typecheck

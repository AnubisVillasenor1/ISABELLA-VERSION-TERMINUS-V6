name: IDR provider contract tests

on:
  pull_request:
    paths:
      - "src/domain-runtime/**"
      - "src/routes/domain-runtime.ts"
      - "test/domain-runtime-*.test.ts"
      - ".github/workflows/idr-provider-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
  push:
    branches:
      - main
      - "feat/idr-semantic-router-v1"
    paths:
      - "src/domain-runtime/**"
      - "src/routes/domain-runtime.ts"
      - "test/domain-runtime-*.test.ts"
      - ".github/workflows/idr-provider-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"

permissions:
  contents: read

concurrency:
  group: idr-provider-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  idr-contract:
    name: IDR router and provider contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v-pinned from tag v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v-pinned from tag v4
        with:
          version: 10.28.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v-pinned from tag v4
        with:
          node-version: 24
          cache: pnpm
      - name: Enable pinned package manager
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Run IDR contract tests
        run: corepack pnpm exec vitest run test/domain-runtime-semantic-router.test.ts test/domain-runtime-embedding-providers.test.ts
      - name: Type-check repository
        run: corepack pnpm typecheck
